async function abrir(chave){
  const bruto=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(IV)},chave,b(DADO));
  const html=await new Response(new Blob([bruto]).stream().pipeThrough(new DecompressionStream("gzip"))).text();

async function chaveDe(senha){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(senha),"PBKDF2",false,["deriveKey"]);
