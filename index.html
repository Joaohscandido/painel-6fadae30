const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(chave){
  const bruto=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(IV)},chave,b(DADO));
  const html=await new Response(new Blob([bruto]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open();document.write(html);document.close();
}
async function chaveDe(senha){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(senha),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b(SALT),iterations:R,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
const guardada=localStorage.getItem("painel-tcc-chave");
if(guardada) crypto.subtle.importKey("raw",b(guardada),"AES-GCM",true,["decrypt"]).then(abrir).catch(()=>localStorage.removeItem("painel-tcc-chave"));
document.getElementById("f").onsubmit=async ev=>{
  ev.preventDefault();const e=document.getElementById("e");e.textContent="Abrindo...";
  try{const k=await chaveDe(document.getElementById("s").value);
    if(document.getElementById("l").checked) await crypto.subtle.exportKey("raw",k).then(r=>localStorage.setItem("painel-tcc-chave",btoa(String.fromCharCode(...new Uint8Array(r)))));
    await abrir(k);}catch(x){e.textContent="Senha errada.";}
};
